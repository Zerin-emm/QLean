<!DOCTYPE html><html><head><meta charset=utf-8><meta http-equiv=Content-Security-Policy content="script-src 'self' 'unsafe-inline'"><title>设置</title><script defer=defer src=./modal-preference.js></script><link href=./modal-preference.css rel=stylesheet><style>.wrap-update .title,.wrap-update .notes,.updater-tab-bar-mark-light{display:none!important}</style><style>.qlean-update-notice{margin:18px 0 0;padding:16px 18px;border:1px solid #e6e8eb;border-radius:8px;background:#f7f8fa;color:#1f2026;font-size:13px;line-height:20px}.qlean-update-title{font-size:15px;font-weight:600;margin-bottom:6px}.qlean-update-desc{color:#5c5f66}.qlean-update-link{margin-top:8px;color:#0d53ff;cursor:pointer;word-break:break-all}</style></head><body><div id=root></div><script>(function(){function hn(){try{var h=["备份设置","客服咨询","安全公告"];var a=document.querySelectorAll(".nav-wrap .nav-item");for(var i=0;i<a.length;i++){if(h.indexOf((a[i].textContent||"").trim())>=0)a[i].style.display="none";}var act=document.querySelector(".nav-wrap .nav-item.nav-item-active");if(act&&h.indexOf((act.textContent||"").trim())>=0){var f=document.querySelector(".nav-wrap .nav-item");if(f)f.click();}}catch(e){}}function bu(){try{var a=document.querySelectorAll(".wrap-update .title,.wrap-update .notes");for(var i=0;i<a.length;i++)a[i].style.display="none";var m=document.querySelectorAll(".updater-tab-bar-mark-light");for(var j=0;j<m.length;j++)m[j].style.display="none";}catch(e){}}try{var ipc=require("electron").ipcRenderer;var o=ipc.invoke.bind(ipc);ipc.invoke=function(ch){var a=[].slice.call(arguments,1);if(ch==="bridge"&&typeof a[0]==="string"&&a[0].indexOf("updater.")===0)return Promise.resolve(null);return o.apply(null,arguments);};}catch(e){}hn();bu();setInterval(hn,800);setInterval(bu,800);})();</script></body></html>
